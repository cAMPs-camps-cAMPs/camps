<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 検索エンジンに載せないための設定 -->
  <meta name="robots" content="noindex, nofollow">
  <title></title>
  <link rel="icon" href="images/logo.webp">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body data-page="top">
  <header class="site-header">
    <a class="logo" href="index.html"><img src="images/logo.webp" alt=""><span class="site-name"></span></a>
    <nav>
      <a href="index.html" class="current">トップ</a>
      <a href="members.html">メンバー</a>
      <a href="games.html">ゲーム</a>
      <a href="links.html">リンク集</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <!-- ロゴの左半分（太陽側）を押すとライト、右半分（月側）を押すとダーク -->
      <div class="hero-logo-wrap">
        <h1><img class="hero-logo" src="images/logo.webp" alt="cAMPs"></h1>
        <button type="button" class="theme-half theme-day" data-theme-set="light" aria-label="ライトモードにする" title="昼（ライトモード）"></button>
        <button type="button" class="theme-half theme-night" data-theme-set="dark" aria-label="ダークモードにする" title="夜（ダークモード）"></button>
      </div>
      <p class="site-catchcopy"></p>
    </section>

    <section class="block">
      <h2 class="block-title">ABOUT</h2>
      <div id="site-about"></div>
    </section>

    <section class="block">
      <h2 class="block-title">MEMBERS</h2>
      <div id="top-members" class="mini-members"></div>
      <p class="more"><a href="members.html">メンバー紹介を見る →</a></p>
    </section>
  </main>

  <footer class="site-footer"><span class="site-name"></span></footer>

  <!-- data.js（中身）→ script.js（表示）の順に読み込む -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
